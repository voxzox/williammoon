function drawShip(){var s=ship;if(!s||freeMode)return;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);var w=s.w,h=w*.29;ctx.fillStyle='#192e43';ctx.beginPath();ctx.moveTo(-w*.53,-h*.25);ctx.lineTo(w*.51,-h*.25);ctx.lineTo(w*.36,h*.55);ctx.lineTo(-w*.34,h*.55);ctx.closePath();ctx.fill();ctx.strokeStyle='#8ac5df';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#df6e4b';ctx.fillRect(-w*.42,-h*.26,w*.84,h*.12);ctx.fillStyle='#e5f3f4';ctx.fillRect(-w*.24,-h*.75,w*.42,h*.47);ctx.fillStyle='#4c99c5';for(var i=0;i<3;i++)ctx.fillRect(-w*.18+i*w*.12,-h*.65,w*.075,h*.13);ctx.fillStyle='#f8dc8b';ctx.fillRect(w*.14,-h*.94,w*.06,h*.20);ctx.fillStyle='#22333a';ctx.fillRect(-w*.4,h*.12,w*.8,Math.max(1,h*.05));for(var j=0;j<s.holes.length;j++){var p=s.holes[j];ctx.fillStyle='#050c16';ctx.beginPath();ctx.arc(p.dx,clamp(p.dy,-h*.1,h*.45),4,0,Math.PI*2);ctx.fill()}if(s.fill>0){ctx.fillStyle='rgba(31,174,230,.55)';ctx.fillRect(-w*.35,h*(.46-s.fill*.8),w*.70,Math.min(h*.8,s.fill*h*.75))}ctx.restore()}

var s=ship,c=levels[level];if(!freeMode&&s&&!win){var sea=surfaceAt(s.x),a=surfaceAt(s.x-s.w*.30),b=surfaceAt(s.x+s.w*.30),slope=Math.atan2(b-a,s.w*.6);var desired=sea-s.w*.095+s.fill*s.w*.88;var gravity=(desired-s.y)*.028;s.vy=(s.vy+gravity)*.91;s.y+=s.vy;s.angV+=(slope-s.angle)*.022; s.angV+=(tilt*.17-s.angle)*.006;s.angV*=.92;s.angle=clamp(s.angle+s.angV,-1.48,1.48);s.vx+=(tilt*.11+Math.sin(frame*.01)*.012);s.vx*=.984;s.x=clamp(s.x+s.vx,tank.x+s.w*.46,tank.x+tank.w-s.w*.46);if(s.damage)s.fill+=.00035+s.damage*c.leak*.00012;if(Math.abs(s.angle)>.68)s.fill+=.0017;if(s.y>sea+s.w*.15)s.fill+=.0015;if(s.fill>.27&&frame%5===0)bubble(s.x+rnd(-s.w*.28,s.w*.28),s.y+12);if(frame%28===0&&Math.abs(s.vy)>1)splash(s.x,sea,.4,3);if(s.fill>=1||s.y>tank.y+tank.h-18){win=true;s.sunk=true;setTimeout(function(){el('resultTitle').textContent='🚢 침몰 성공!';el('resultText').textContent=(level+1)+'레벨 '+c.name+' 격침 완료! 다음 배는 더 튼튼하고 어렵습니다.';el('continue').textContent=level===7?'처음부터 다시':'다음 레벨 시작';el('next').style.display='block';el('overlay').classList.add('show')},850)}}updateSpill();for(var p=particles.length-1;p>=0;p--){var q=particles[p];q.x+=q.vx;q.y+=q.vy;q.life--;if(q.under){q.vx*=.98;if(q.y<=surfaceAt(q.x)){disturb(q.x,-.8);particles.splice(p,1);continue}}else{q.vy+=.17;q.vx*=.99;if(q.y>surfaceAt(q.x)&&q.vy>0){bubble(q.x,q.y);particles.splice(p,1);continue}}if(q.life<=0)particles.splice(p,1)}for(var z=debris.length-1;z>=0;z--){var d=debris[z];d.x+=d.vx;d.y+=d.vy;d.vy+=.12;d.life--;if(d.life<=0)debris.splice(z,1)}}

function cutPoly(poly,nx,ny,threshold){

  var a=poly[i],b=poly[(i+1)%poly.length],da=a.x*nx+a.y*ny-threshold,db=b.x*nx+b.y*ny-threshold;

  if((da>=0)!==(db>=0)){var t=da/(da-db);out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}
 }return out
}
