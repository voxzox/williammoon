<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061627"><title>WAVE TANK | 침몰 챌린지</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#051422;color:#eaf9ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));gap:9px}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:7px}.pill{border:1px solid #9beaff38;background:#071a2de8;backdrop-filter:blur(10px);padding:9px 12px;border-radius:15px;font-size:12px;font-weight:750}.logo{font-size:17px;letter-spacing:-.04em}.light{color:#71defe}.bottom{margin-top:auto;align-items:flex-end}.col{display:flex;flex-direction:column;gap:7px}.ui button{pointer-events:auto;color:#edffff;border:1px solid #79e4f65c;background:#10364abf;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:800;min-height:44px}.ui button.primary{background:#a6f655;color:#07231b;border:0}.ui button:active{transform:scale(.97)}.message{align-self:center;text-align:center;max-width:430px;background:#082337d9;padding:9px 13px;border-radius:13px;font-size:12px;border:1px solid #83daff36}.sensor{font-size:11px;max-width:230px;line-height:1.6}.overlay{pointer-events:auto;position:fixed;inset:0;background:#00131dbb;display:none;place-items:center;padding:20px}.overlay.show{display:grid}.modal{width:min(420px,100%);border:1px solid #72e7ff55;background:#0a2635;padding:25px;border-radius:24px;box-shadow:0 15px 60px #0008}.modal h1{margin:0 0 8px;font-size:27px}.modal p{line-height:1.65;color:#b6d6df}.modal button{border:0;border-radius:13px;padding:13px 20px;background:#baff58;color:#07251a;font-weight:850;font-size:15px;width:100%}.modal small{color:#8eb3c0}.levelbar{font-size:11px;opacity:.86}@media(max-width:400px){.logo{font-size:15px}.pill{padding:8px 9px}.ui{padding-left:8px;padding-right:8px}.ui button{padding:10px}.sensor{max-width:175px}}
</style></head><body>
<canvas id="game"></canvas>
<div class="ui"><div class="top"><div class="pill"><div class="logo">🌊 WAVE <span class="light">TANK</span></div><div class="levelbar" id="level">LEVEL 1 / 8</div></div><div class="pill" id="objective">배를 침몰시켜!</div></div><div class="top"><div class="pill sensor" id="sensor">📱 센서 확인 중…</div><button id="enable">자이로 켜기</button></div><div class="message" id="hint">휴대폰을 기울이거나 흔들고, 배를 터치해 구멍을 내세요.</div><div class="bottom"><div class="col"><button id="wave">🌊 큰 파도</button><button id="tiltLeft">↶ 왼쪽</button></div><div class="col"><button id="reset">↻ 재시작</button><button id="tiltRight">오른쪽 ↷</button><button class="primary" id="next" style="display:none">다음 레벨 ➜</button></div></div></div>
<div class="overlay" id="overlay"><div class="modal"><h1 id="resultTitle">성공!</h1><p id="resultText"></p><button id="continue">다음 레벨 시작</button><p><small>물리 시뮬레이션은 게임용 근사 모델입니다.</small></p></div></div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false}),dpr=1,W=0,H=0,tank={x:0,y:0,w:0,h:0},surface=[],velocity=[],segments=95,waterLevel=0,ship=null,particles=[],debris=[],level=0,win=false,frame=0,tilt=0,sensorTilt=0,shake=0,lastAccel=0,lastMotion=0,lastOrientation=0,orientationCount=0,motionCount=0,permissionAsked=false,dragStart=null,mouseX=0,mouseY=0;
var levels=[
{name:'종이배',width:74,health:2,leak:1.1,buoy:1.0,wave:1.0},
{name:'나무배',width:100,health:4,leak:.75,buoy:1.1,wave:1.0},
{name:'어선',width:115,health:5,leak:.65,buoy:1.05,wave:1.1},
{name:'요트',width:125,health:6,leak:.5,buoy:1.0,wave:1.2},
{name:'구조선',width:135,health:7,leak:.48,buoy:1.1,wave:1.3},
{name:'화물선',width:155,health:8,leak:.43,buoy:1.16,wave:1.4},
{name:'유람선',width:170,health:9,leak:.40,buoy:1.13,wave:1.5},
{name:'폭풍의 최종선',width:184,health:12,leak:.38,buoy:1.16,wave:1.9}
];
function el(id){return document.getElementById(id)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return a+Math.random()*(b-a)}
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);tank.x=Math.max(13,W*.07);tank.w=W-2*tank.x;tank.y=Math.max(112,H*.20);tank.h=Math.max(180,H*.59);waterLevel=tank.y+tank.h*.50;var old=surface.slice();surface=Array.from({length:segments},function(_,i){return old.length?old[Math.min(old.length-1,Math.round(i*(old.length-1)/(segments-1)))]||0:0});velocity=Array.from({length:segments},function(){return 0});if(ship)ship.x=clamp(ship.x,tank.x+ship.w/2,tank.x+tank.w-ship.w/2)}
function surfaceAt(x){var i=clamp((x-tank.x)/tank.w*(segments-1),0,segments-1),j=Math.floor(i);return waterLevel+(surface[j]||0)*(1-(i-j))+(surface[Math.min(segments-1,j+1)]||0)*(i-j)+tilt*(x-(tank.x+tank.w/2))*.18}
function splash(x,y,power,count){count=count||14;for(var i=0;i<count;i++)particles.push({x:x,y:y,vx:rnd(-2.8,2.8)*power,vy:rnd(-5,-.4)*power,r:rnd(1.5,4.2),life:rnd(25,70),max:70,under:false});if(particles.length>280)particles.splice(0,particles.length-280)}
function bubble(x,y){particles.push({x:x,y:y,vx:rnd(-.55,.55),vy:rnd(-1.7,-.55),r:rnd(1.5,5),life:rnd(40,110),max:110,under:true})}
function disturb(x,power){var k=Math.round(clamp((x-tank.x)/tank.w,0,1)*(segments-1));for(var i=-5;i<=5;i++){var j=k+i;if(j>=0&&j<segments)velocity[j]+=power*Math.exp(-i*i/9)}}
function bigWave(){for(var i=0;i<segments;i++){velocity[i]+=(i<segments/2?1:-1)*rnd(1.3,3.2)*levels[level].wave}shake=12;for(var k=0;k<4;k++)disturb(rnd(tank.x,tank.x+tank.w),rnd(-8,8));splash(ship.x,surfaceAt(ship.x),1.4,22)}
function newLevel(index){level=index%levels.length;win=false;el('overlay').classList.remove('show');el('next').style.display='none';el('level').textContent='LEVEL '+(level+1)+' / '+levels.length+' · '+levels[level].name;el('objective').textContent='선체 '+levels[level].health+'회 타격';surface.fill(0);velocity.fill(0);particles=[];debris=[];var c=levels[level];ship={x:tank.x+tank.w*.50,y:waterLevel-20,w:Math.min(c.width,tank.w*.62),vy:0,vx:0,angle:0,angV:0,damage:0,fill:0,holes:[],sunk:false};el('hint').textContent='배를 터치해 구멍을 내고, 파도로 균형을 무너뜨려 침몰시키세요.'}
function impact(x,y){if(!ship||win)return;var s=ship;if(Math.abs(x-s.x)<s.w*.60 && Math.abs(y-s.y)<56){s.damage++;s.holes.push({dx:x-s.x,dy:y-s.y});s.vy+=1.7;s.angV+=(x-s.x)/s.w*.075;s.fill+=.055;disturb(s.x,6);splash(x,y,1.2,15);for(var i=0;i<7;i++)debris.push({x:x,y:y,vx:rnd(-3,3),vy:rnd(-3,-.5),life:rnd(25,80),angle:rnd(0,6)});el('objective').textContent='타격 '+s.damage+' / '+levels[level].health;if(s.damage>=levels[level].health)s.fill+=.20}else{disturb(x,9);splash(x,clamp(y,waterLevel-20,tank.y+tank.h),1,9)}}
function sensorText(status){el('sensor').textContent=status}
function orient(e){if(e.gamma==null&&e.beta==null)return;orientationCount++;lastOrientation=performance.now();var g=Number(e.gamma)||0;sensorTilt=clamp(g/40,-1,1);sensorText('🟢 자이로 연결 · 좌우 '+g.toFixed(1)+'°'+(motionCount?' · 흔들기 활성':' · 흔들기 대기'));el('enable').textContent='센서 연결됨'}
function motion(e){var a=e.acceleration||e.accelerationIncludingGravity;if(!a)return;motionCount++;lastMotion=performance.now();var x=a.x||0,y=a.y||0,z=a.z||0,mag=Math.hypot(x,y,z);var delta=Math.abs(mag-lastAccel);lastAccel=mag;if(delta>8&&frame%8===0)bigWave();if(!orientationCount&&motionCount>3)sensorText('🟡 움직임 감지 · 기울기 대기')}
window.addEventListener('deviceorientation',orient,true);window.addEventListener('devicemotion',motion,true);
async function enableSensor(){permissionAsked=true;try{var requests=[];if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')requests.push(DeviceOrientationEvent.requestPermission());if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')requests.push(DeviceMotionEvent.requestPermission());if(requests.length){var results=await Promise.all(requests);if(results.some(function(x){return x!=='granted'})){sensorText('🔴 센서 권한 거부됨 · 설정에서 허용');return}}sensorText('🟡 권한 허용됨 · 휴대폰을 기울여 확인');setTimeout(function(){if(!orientationCount&&!motionCount)sensorText('⚪ 센서 신호 없음 · HTTPS와 기기 설정 확인')},2500)}catch(e){sensorText('🔴 센서 사용 불가 · '+e.message)}}
el('enable').addEventListener('click',enableSensor);el('wave').addEventListener('click',bigWave);el('reset').addEventListener('click',function(){newLevel(level)});el('next').addEventListener('click',function(){newLevel(level+1)});
el('tiltLeft').addEventListener('click',function(){tilt=clamp(tilt-.5,-1,1);bigWave()});el('tiltRight').addEventListener('click',function(){tilt=clamp(tilt+.5,-1,1);bigWave()});
el('continue').addEventListener('click',function(){newLevel(level+1)});
canvas.addEventListener('pointerdown',function(e){dragStart={x:e.clientX,y:e.clientY,time:performance.now()};mouseX=e.clientX;mouseY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',function(e){if(!dragStart)return;var dx=e.clientX-mouseX;mouseX=e.clientX;mouseY=e.clientY;if(Math.abs(dx)>1){tilt=clamp(tilt+dx/300,-1,1);disturb(e.clientX,clamp(dx*.36,-6,6))}});
canvas.addEventListener('pointerup',function(e){if(!dragStart)return;if(Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)<25)impact(e.clientX,e.clientY);else if(Math.abs(e.clientX-dragStart.x)>90)bigWave();dragStart=null});
function drawShip(){var s=ship;if(!s)return;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);var w=s.w,h=w*.29;ctx.fillStyle='#192e43';ctx.beginPath();ctx.moveTo(-w*.53,-h*.25);ctx.lineTo(w*.51,-h*.25);ctx.lineTo(w*.36,h*.55);ctx.lineTo(-w*.34,h*.55);ctx.closePath();ctx.fill();ctx.strokeStyle='#8ac5df';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#df6e4b';ctx.fillRect(-w*.42,-h*.26,w*.84,h*.12);ctx.fillStyle='#e5f3f4';ctx.fillRect(-w*.24,-h*.75,w*.42,h*.47);ctx.fillStyle='#4c99c5';for(var i=0;i<3;i++)ctx.fillRect(-w*.18+i*w*.12,-h*.65,w*.075,h*.13);ctx.fillStyle='#f8dc8b';ctx.fillRect(w*.14,-h*.94,w*.06,h*.20);ctx.fillStyle='#22333a';ctx.fillRect(-w*.4,h*.12,w*.8,Math.max(1,h*.05));for(var j=0;j<s.holes.length;j++){var p=s.holes[j];ctx.fillStyle='#050c16';ctx.beginPath();ctx.arc(p.dx,clamp(p.dy,-h*.1,h*.45),4,0,Math.PI*2);ctx.fill()}if(s.fill>0){ctx.fillStyle='rgba(31,174,230,.55)';ctx.fillRect(-w*.35,h*(.46-s.fill*.8),w*.70,Math.min(h*.8,s.fill*h*.75))}ctx.restore()}
function physics(){frame++;var target=orientationCount&&performance.now()-lastOrientation<2200?sensorTilt:0;tilt+=((dragStart?tilt:target)-tilt)*.014;tilt=clamp(tilt,-1,1);var old=surface.slice();for(var i=0;i<segments;i++){var left=old[Math.max(0,i-1)],right=old[Math.min(segments-1,i+1)];var force=-old[i]*.024+(left+right-2*old[i])*.20;velocity[i]=(velocity[i]+force)*.982;surface[i]=clamp(old[i]+velocity[i],-tank.h*.23,tank.h*.23)}if(level===7&&frame%90===0)bigWave();
var s=ship,c=levels[level];if(s&&!win){var sea=surfaceAt(s.x),a=surfaceAt(s.x-s.w*.30),b=surfaceAt(s.x+s.w*.30),slope=Math.atan2(b-a,s.w*.6);var desired=sea-s.w*.095+s.fill*s.w*.88;var gravity=(desired-s.y)*.028;s.vy=(s.vy+gravity)*.91;s.y+=s.vy;s.angV+=(slope-s.angle)*.022; s.angV+=(tilt*.17-s.angle)*.006;s.angV*=.92;s.angle=clamp(s.angle+s.angV,-1.48,1.48);s.vx+=(tilt*.11+Math.sin(frame*.01)*.012);s.vx*=.984;s.x=clamp(s.x+s.vx,tank.x+s.w*.46,tank.x+tank.w-s.w*.46);if(s.damage)s.fill+=.00035+s.damage*c.leak*.00012;if(Math.abs(s.angle)>.68)s.fill+=.0017;if(s.y>sea+s.w*.15)s.fill+=.0015;if(s.fill>.27&&frame%5===0)bubble(s.x+rnd(-s.w*.28,s.w*.28),s.y+12);if(frame%28===0&&Math.abs(s.vy)>1)splash(s.x,sea,.4,3);if(s.fill>=1||s.y>tank.y+tank.h-18){win=true;s.sunk=true;setTimeout(function(){el('resultTitle').textContent='🚢 침몰 성공!';el('resultText').textContent=(level+1)+'레벨 '+c.name+' 격침 완료! 다음 배는 더 튼튼하고 어렵습니다.';el('continue').textContent=level===7?'처음부터 다시':'다음 레벨 시작';el('next').style.display='block';el('overlay').classList.add('show')},850)}}for(var p=particles.length-1;p>=0;p--){var q=particles[p];q.x+=q.vx;q.y+=q.vy;q.life--;if(q.under){q.vx*=.98;if(q.y<=surfaceAt(q.x)){disturb(q.x,-.8);particles.splice(p,1);continue}}else{q.vy+=.17;q.vx*=.99;if(q.y>surfaceAt(q.x)&&q.vy>0){bubble(q.x,q.y);particles.splice(p,1);continue}}if(q.life<=0)particles.splice(p,1)}for(var z=debris.length-1;z>=0;z--){var d=debris[z];d.x+=d.vx;d.y+=d.vy;d.vy+=.12;d.life--;if(d.life<=0)debris.splice(z,1)}}
function draw(){ctx.fillStyle='#061827';ctx.fillRect(0,0,W,H);var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b3044');bg.addColorStop(1,'#04101f');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(var st=0;st<30;st++){var xx=(st*119.7)%W,yy=(st*91.2)%H;ctx.fillStyle='rgba(180,237,255,.05)';ctx.fillRect(xx,yy,2,2)}ctx.fillStyle='#112e3d';ctx.fillRect(tank.x-5,tank.y-4,tank.w+10,tank.h+11);ctx.fillStyle='#071d31';ctx.fillRect(tank.x,tank.y,tank.w,tank.h);ctx.save();ctx.beginPath();ctx.rect(tank.x,tank.y,tank.w,tank.h);ctx.clip();var water=ctx.createLinearGradient(0,waterLevel-90,0,tank.y+tank.h);water.addColorStop(0,'rgba(54,226,255,.72)');water.addColorStop(.3,'rgba(9,149,218,.86)');water.addColorStop(1,'rgba(0,67,130,.97)');ctx.beginPath();ctx.moveTo(tank.x,tank.y+tank.h);for(var k=0;k<segments;k++)ctx.lineTo(tank.x+k*tank.w/(segments-1),surfaceAt(tank.x+k*tank.w/(segments-1)));ctx.lineTo(tank.x+tank.w,tank.y+tank.h);ctx.closePath();ctx.fillStyle=water;ctx.fill();ctx.strokeStyle='#a3f6ff';ctx.lineWidth=3;ctx.beginPath();for(var j=0;j<segments;j++){var x=tank.x+j*tank.w/(segments-1),y=surfaceAt(x);if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.strokeStyle='#c7faff26';ctx.lineWidth=1;for(var r=0;r<4;r++){ctx.beginPath();for(var n=0;n<segments;n++){var px=tank.x+n*tank.w/(segments-1),py=surfaceAt(px)+14+r*24+Math.sin(n*.22+frame*.06+r)*3;if(n===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke()}drawShip();for(var m=0;m<particles.length;m++){var v=particles[m];ctx.globalAlpha=clamp(v.life/v.max,.12,1);ctx.fillStyle=v.under?'#b5f7ff':'#e9fcff';ctx.beginPath();ctx.arc(v.x,v.y,v.r,0,6.283);if(v.under){ctx.strokeStyle='#b9efff';ctx.lineWidth=1;ctx.stroke()}else ctx.fill()}ctx.globalAlpha=1;for(var d=0;d<debris.length;d++){var b=debris[d];ctx.fillStyle='#dd8f59';ctx.fillRect(b.x,b.y,3,3)}ctx.restore();ctx.strokeStyle='#69c7e366';ctx.lineWidth=3;ctx.strokeRect(tank.x,tank.y,tank.w,tank.h);ctx.fillStyle='#91def887';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText('물 수위 50% · 실시간 파동 시뮬레이션',W/2,tank.y+tank.h+26);if(frame%180===0&&!orientationCount&&permissionAsked)sensorText('⚪ 센서 신호 없음 · HTTPS/기기 권한 확인');requestAnimationFrame(loop)}
function loop(){physics();draw()}
window.addEventListener('resize',resize);resize();newLevel(0);requestAnimationFrame(loop);
if(!('DeviceOrientationEvent'in window)&&!('DeviceMotionEvent'in window))sensorText('⚪ 자이로 미지원 · 터치/버튼으로 플레이');else sensorText('🟡 자이로 대기 · 센서 켜기 누르세요');
})();
</script></body></html>
