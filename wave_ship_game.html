<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071322"><meta name="apple-mobile-web-app-capable" content="yes"><title>WAVE LAB — Liquid Simulator</title><link rel="manifest" href="wave-manifest.webmanifest"><style>
:root{color-scheme:dark;--text:#eaf4ff;--soft:#9fb4c8;--stroke:#ffffff20;--cyan:#65d8fa;--lime:#b3ff69}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060f1b;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.chrome{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:10px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.header,.footer{display:flex;align-items:center;gap:9px;justify-content:space-between}.header{flex-wrap:wrap}.brand{font-size:16px;font-weight:900;letter-spacing:.08em}.brand em{color:var(--cyan);font-style:normal}.sub{color:var(--soft);font-size:10px;font-weight:700;letter-spacing:.1em}.panel{border:1px solid var(--stroke);background:#10253edb;box-shadow:0 12px 42px #0003;backdrop-filter:blur(14px);border-radius:17px;padding:10px 14px}.header .panel{max-width:100%}.status{font-size:11px;color:#d9eaff;max-width:330px;line-height:1.55}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f6cb61;margin-right:5px}.dot.on{background:#8fffaa}.dot.off{background:#ff8b88}.controls{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btn{cursor:pointer;min-height:44px;padding:11px 14px;border-radius:12px;background:#163149ed;border:1px solid #76b6e34d;color:#f5fbff;font-weight:750;font-size:12px;white-space:nowrap}.btn:active{transform:scale(.97)}.btn.primary{background:linear-gradient(110deg,#adf974,#5de2eb);color:#06202e;border:0}.footer{margin-top:auto;flex-wrap:wrap;align-items:end}.footer .panel{font-size:11px;color:#bdd3e3;line-height:1.5;max-width:320px}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#020a14cc;backdrop-filter:blur(8px);z-index:3;padding:18px}.overlay.show{display:grid}.modal{pointer-events:auto;width:min(470px,100%);max-height:90dvh;overflow:auto;border-radius:24px;background:#0e2337;border:1px solid #ffffff28;padding:22px;box-shadow:0 30px 80px #0009}.modal h2{margin:0 0 8px;font-size:24px}.modal p{font-size:13px;color:#9bb9cc;line-height:1.6}.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0}.levels button{min-height:52px;text-align:left;white-space:normal}.ship-title{font-weight:800;color:var(--lime)}@media(max-width:620px){.chrome{gap:7px}.header{align-items:flex-start}.brand{font-size:14px}.status{font-size:10px}.footer{justify-content:center}.footer .panel{display:none}.btn{font-size:11px;padding:9px 10px}.controls{width:100%}.controls .btn{flex:1}.header .panel{padding:8px 10px}.sub{font-size:9px}}@media(max-height:580px){.footer .panel{display:none}.chrome{gap:4px;padding-top:6px;padding-bottom:6px}}
</style></head><body><canvas id="world"></canvas><div class="chrome">
<div class="header"><div class="panel"><div class="brand">WAVE<em>LAB</em> <span class="sub">/ LIQUID SIMULATOR</span></div><div class="sub" id="modeLabel">FREE PLAY · WATER 50%</div></div><div class="panel status" id="sensor"><span class="dot"></span>센서 대기 · 아래에서 센서 켜기를 누르세요</div></div>
<div class="footer"><div class="panel" id="help">폰을 기울이거나 흔들어 보세요. 화면을 밀어도 물이 움직여요.</div><div class="controls"><button class="btn" id="sensorBtn">📱 센서 켜기</button><button class="btn" id="splashBtn">🌊 흔들기</button><button class="btn" id="refillBtn">↻ 물 채우기</button><button class="btn primary" id="gameBtn">🚢 미니게임</button></div></div></div>
<div class="overlay" id="menu"><div class="modal"><h2>🚢 침몰 챌린지</h2><p>파도와 선체 타격으로 배를 침몰시켜 보세요. 자유 물놀이는 언제든 돌아갈 수 있어요.</p><div class="levels" id="levelList"></div><button class="btn" id="backBtn" style="width:100%">🌊 자유 물놀이로 돌아가기</button></div></div>
<div class="overlay" id="win"><div class="modal"><h2>🏆 침몰 성공!</h2><p id="winText">다음 배를 침몰시켜 보세요.</p><button class="btn primary" id="nextBtn" style="width:100%">다음 레벨</button><button class="btn" id="exitBtn" style="width:100%;margin-top:9px">자유 물놀이</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),c=canvas.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=(a,b)=>a+Math.random()*(b-a);
let W=0,H=0,dpr=1,tank={x:0,y:0,w:0,h:0},volume=.50,angX=0,angY=1,targetX=0,targetY=1,manualUntil=0;
let orientationCount=0,motionCount=0,lastSensor=0,lastShake=0,lastAcceleration=null,permissionNeeded=false,sensorState='idle',frame=0,mode='free',level=0,ship=null,drag=null;
const N=85,displacement=new Float32Array(N),speed=new Float32Array(N),drops=[],bubbles=[];
const configs=[['종이배',75,2],['목선',98,3],['어선',108,4],['요트',122,5],['구조선',134,6],['화물선',148,7],['여객선',161,8],['폭풍선',178,10]];
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);c.setTransform(dpr,0,0,dpr,0,0);const pad=Math.max(16,Math.min(W*.08,65));tank={x:pad,y:Math.max(90,H*.20),w:W-2*pad,h:Math.max(140,H*.57)};if(ship)ship.x=clamp(ship.x,tank.x+ship.w*.4,tank.x+tank.w-ship.w*.4)}
addEventListener('resize',resize);
function status(txt,state){sensorState=state;const cls=state==='on'?'on':state==='off'?'off':'';$('sensor').innerHTML='<span class="dot '+cls+'"></span>'+txt}
function gravityFromOrientation(e){
 if(e.beta==null||e.gamma==null)return;
 const beta=e.beta*Math.PI/180,gamma=e.gamma*Math.PI/180,screenAngle=(screen.orientation&&Number.isFinite(screen.orientation.angle))?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0),rot=screenAngle*Math.PI/180;
 // Device axes mapped to visible screen axes; upright portrait: beta≈90° => down.
 const gx=Math.sin(gamma),gy=Math.sin(beta)*Math.cos(gamma);
 targetX=clamp(gx*Math.cos(rot)-gy*Math.sin(rot),-1,1);
 targetY=clamp(gx*Math.sin(rot)+gy*Math.cos(rot),-1,1);
 orientationCount++;lastSensor=performance.now();
 if(orientationCount%4===0)status('센서 연결 · 좌우 '+Math.round(e.gamma)+'° / 앞뒤 '+Math.round(e.beta)+'°','on');
}
function motion(e){
 const a=e.accelerationIncludingGravity;if(!a)return;
 motionCount++;let ax=Number(a.x)||0,ay=Number(a.y)||0,az=Number(a.z)||0;
 const mag=Math.hypot(ax,ay,az);
 if(lastAcceleration&&performance.now()-lastShake>160){
 const delta=Math.hypot(ax-lastAcceleration[0],ay-lastAcceleration[1],az-lastAcceleration[2]);
 if(delta>5.8){splash(1.6);lastShake=performance.now()}
 }
 lastAcceleration=[ax,ay,az];
 // iOS and Android sometimes restrict orientation but expose accelerometer.
 if(performance.now()-lastSensor>1200&&mag>2){
 const sx=clamp(-ax/mag,-1,1),sy=clamp(ay/mag,-1,1);
 targetX=sx;targetY=sy;lastSensor=performance.now();
 status('움직임 센서 연결 · 좌우 '+Math.round(sx*100)+'%','on')
 }
}
addEventListener('deviceorientation',gravityFromOrientation,true);
addEventListener('devicemotion',motion,true);
$('sensorBtn').onclick=async()=>{
 try{
 let asked=false,allowed=true;
 if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){asked=true;allowed=(await DeviceOrientationEvent.requestPermission())==='granted'&&allowed}
 if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){asked=true;allowed=(await DeviceMotionEvent.requestPermission())==='granted'&&allowed}
 if(!allowed){status('센서 권한 거부 · 브라우저 설정에서 허용','off');return}
 status('센서 대기 · 휴대폰을 기울여 보세요','idle');
 setTimeout(()=>{if(performance.now()-lastSensor>2300)status('신호 없음 · HTTPS / 센서 지원 여부 확인','off')},2600);
 }catch(err){status('센서 권한 요청 실패 · '+String(err.message).slice(0,38),'off')}
};
function particle(x,y,vx,vy,r=3){if(drops.length>240)drops.shift();drops.push({x,y,vx,vy,r,life:150})}
function emit(x,y,count,strength){for(let i=0;i<count;i++)particle(x+rnd(-20,20),y+rnd(-5,5),rnd(-4,4)*strength,rnd(-5,-.5)*strength,rnd(1.4,4))}
function splash(scale=1){for(let i=0;i<N;i++)speed[i]+=Math.sin(i*.18+frame*.14)*rnd(-1.8,1.8)*scale;const x=tank.x+tank.w*rnd(.2,.8),y=tank.y+tank.h*.5;emit(x,y,22,scale)}
$('splashBtn').onclick=()=>splash(2);
$('refillBtn').onclick=()=>{volume=.5;drops.length=0;displacement.fill(0);speed.fill(0);if(mode==='ship')startLevel(level);updateLabel()};
function updateLabel(){$('modeLabel').textContent=mode==='free'?'FREE PLAY · WATER '+Math.round(volume*100)+'%':'LEVEL '+(level+1)+' / '+configs.length+' · '+configs[level][0]}
function startLevel(i){mode='ship';level=i;volume=.5;drops.length=0;displacement.fill(0);speed.fill(0);let cfg=configs[i];ship={x:tank.x+tank.w*.5,y:tank.y+tank.h*.49,w:Math.min(cfg[1],tank.w*.6),vy:0,angle:0,damage:0,fill:0,holes:[]};$('menu').classList.remove('show');$('win').classList.remove('show');updateLabel();$('gameBtn').textContent='🚢 미니게임'}
function startFree(){mode='free';ship=null;volume=.5;$('win').classList.remove('show');$('menu').classList.remove('show');updateLabel()}
configs.forEach((cfg,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=(i+1)+'. '+cfg[0];b.onclick=()=>startLevel(i);$('levelList').append(b)});
$('gameBtn').onclick=()=>{$('menu').classList.add('show')};$('backBtn').onclick=startFree;$('exitBtn').onclick=startFree;$('nextBtn').onclick=()=>startLevel((level+1)%configs.length);
function sample(x){const p=clamp((x-tank.x)/tank.w*(N-1),0,N-1),i=Math.floor(p);return displacement[i]*(1-(p-i))+displacement[Math.min(i+1,N-1)]*(p-i)}
function pushAt(x,p){const k=Math.floor(clamp((x-tank.x)/tank.w,0,1)*(N-1));for(let d=-4;d<=4;d++){let j=k+d;if(j>=0&&j<N)speed[j]+=p*Math.exp(-d*d/7)}}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,t:performance.now()};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.px,dy=e.clientY-drag.py;drag.px=e.clientX;drag.py=e.clientY;targetX=clamp(targetX+dx/150,-1,1);targetY=clamp(targetY+dy/230,-1,1);manualUntil=performance.now()+1700;pushAt(e.clientX,-dx*.36);if(Math.abs(dx)+Math.abs(dy)>12&&Math.random()<.55)emit(e.clientX,e.clientY,3,.7)});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const moved=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);if(mode==='ship'&&ship&&moved<28&&Math.abs(e.clientX-ship.x)<ship.w*.58&&Math.abs(e.clientY-ship.y)<ship.w*.7){ship.damage++;ship.fill+=.075;ship.holes.push({x:e.clientX-ship.x,y:e.clientY-ship.y});ship.vy+=1;pushAt(ship.x,8);emit(e.clientX,e.clientY,12,1.4)}else if(moved<25){pushAt(e.clientX,10);emit(e.clientX,e.clientY,10,1)}else if(moved>85)splash(.85);drag=null});
function clipped(poly,nx,ny,h){let out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],da=a.x*nx+a.y*ny-h,db=b.x*nx+b.y*ny-h;if(da>=0)out.push(a);if((da>=0)!==(db>=0)){const f=da/(da-db);out.push({x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f)})}}return out}
function area(poly){let a=0;for(let i=0;i<poly.length;i++){const b=poly[(i+1)%poly.length];a+=poly[i].x*b.y-b.x*poly[i].y}return Math.abs(a/2)}
function polygon(){
 let gx=angX,gy=angY,m=Math.hypot(gx,gy);if(m<.12){gx=0;gy=1}else{gx/=m;gy/=m}
 let corners=[{x:tank.x,y:tank.y},{x:tank.x+tank.w,y:tank.y},{x:tank.x+tank.w,y:tank.y+tank.h},{x:tank.x,y:tank.y+tank.h}],d=corners.map(p=>p.x*gx+p.y*gy),lo=Math.min(...d)-2,hi=Math.max(...d)+2;
 for(let i=0;i<14;i++){let middle=(lo+hi)/2;if(area(clipped(corners,gx,gy,middle))/(tank.w*tank.h)>volume)lo=middle;else hi=middle}
 return clipped(corners,gx,gy,(lo+hi)/2)
}
function update(){
 frame++;
 if(performance.now()>manualUntil&&orientationCount===0&&motionCount===0){targetX=lerp(targetX,0,.035);targetY=lerp(targetY,1,.035)}
 angX=lerp(angX,targetX,.77);angY=lerp(angY,targetY,.77);
 const old=displacement.slice();for(let i=0;i<N;i++){let left=old[Math.max(i-1,0)],right=old[Math.min(i+1,N-1)];speed[i]=(speed[i]-old[i]*.023+(left+right-2*old[i])*.24)*.982;displacement[i]=clamp(old[i]+speed[i],-40,40)}
 if(mode==='free'&&volume>.001&&angY<-.32&&frame%3===0){let amt=Math.min(volume,.0032*Math.abs(angY));volume-=amt;for(let i=0;i<Math.min(13,Math.ceil(amt*2700));i++)particle(tank.x+rnd(5,tank.w-5),tank.y+5,rnd(-4,4)+angX*4,-rnd(2,8),rnd(2,5));updateLabel()}
 let gx=angX,gy=angY,m=Math.max(.5,Math.hypot(gx,gy));for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.vx+=gx/m*.14;d.vy+=gy/m*.14;d.vx*=.992;d.vy*=.992;d.x+=d.vx;d.y+=d.vy;d.life--;if(d.x<tank.x||d.x>tank.x+tank.w||d.y>tank.y+tank.h){d.vx*=-.4;d.vy*=-.4}if(d.life<0||d.y<-60||d.y>H+60||d.x<-60||d.x>W+60)drops.splice(i,1)}
 if(mode==='ship'&&ship){const s=ship,cfg=configs[level],base=tank.y+tank.h*.5+sample(s.x),targetY=base-s.w*.08+s.fill*s.w*.65;s.vy=(s.vy+(targetY-s.y)*.025)*.91;s.y+=s.vy;const delta=sample(s.x+s.w*.3)-sample(s.x-s.w*.3);s.angle=lerp(s.angle,clamp(delta/s.w+angX*.30,-1.25,1.25),.08);s.fill+=s.damage*.00015+Math.max(0,Math.abs(s.angle)-.65)*.0008;if(s.damage>=cfg[2])s.fill+=.005;if(s.fill>=1||s.y>tank.y+tank.h-20){ship=null;$('winText').textContent=cfg[0]+' 격침 성공!';$('win').classList.add('show')}}}
function shipDraw(){if(!ship)return;const s=ship,w=s.w,h=w*.28;c.save();c.translate(s.x,s.y);c.rotate(s.angle);c.fillStyle='#12283b';c.beginPath();c.moveTo(-w*.55,-h*.15);c.lineTo(w*.55,-h*.15);c.lineTo(w*.38,h*.55);c.lineTo(-w*.42,h*.55);c.closePath();c.fill();c.strokeStyle='#b0d7e5';c.lineWidth=2;c.stroke();c.fillStyle='#d9edf1';c.fillRect(-w*.22,-h*.80,w*.47,h*.61);c.fillStyle='#74bada';for(let i=0;i<3;i++)c.fillRect(-w*.18+i*w*.13,-h*.66,w*.085,h*.12);c.fillStyle='#e18069';c.fillRect(-w*.42,-h*.2,w*.84,4);for(const p of s.holes){c.fillStyle='#010b12';c.beginPath();c.arc(p.x,clamp(p.y,-h*.15,h*.45),3.8,0,Math.PI*2);c.fill()}c.restore()}
function draw(){
 const back=c.createLinearGradient(0,0,W,H);back.addColorStop(0,'#061421');back.addColorStop(.6,'#0a2137');back.addColorStop(1,'#061220');c.fillStyle=back;c.fillRect(0,0,W,H);
 c.fillStyle='#a5d7ff08';for(let i=0;i<28;i++)c.fillRect(i*W/27,0,1,H);
 c.fillStyle='#0c283b';c.fillRect(tank.x-4,tank.y,tank.w+8,tank.h+5);
 c.fillStyle='#092033';c.fillRect(tank.x,tank.y,tank.w,tank.h);
 const poly=polygon();c.save();c.beginPath();c.rect(tank.x,tank.y,tank.w,tank.h);c.clip();
 if(poly.length){c.beginPath();c.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)c.lineTo(poly[i].x,poly[i].y);c.closePath();const fill=c.createLinearGradient(tank.x,tank.y,tank.x+tank.w*.3,tank.y+tank.h);fill.addColorStop(0,'#66ebf5');fill.addColorStop(.36,'#12a7d5');fill.addColorStop(1,'#04528c');c.fillStyle=fill;c.fill();c.strokeStyle='#b1ffff';c.lineWidth=2.5;c.stroke();
 // Soft internal light bands, no image textures.
 c.save();c.clip();for(let i=0;i<9;i++){const y=tank.y+i*tank.h/8+Math.sin(frame*.024+i)*7;c.beginPath();c.moveTo(tank.x-10,y);c.bezierCurveTo(tank.x+tank.w*.35,y-9,tank.x+tank.w*.7,y+9,tank.x+tank.w+10,y-4);c.strokeStyle='rgba(191,247,255,.075)';c.lineWidth=5;c.stroke()}c.restore()}
 if(mode==='ship')shipDraw();
 c.restore();
 for(let i=0;i<drops.length;i++){let d=drops[i];c.globalAlpha=clamp(d.life/100,.1,.9);c.fillStyle='#72dfff';c.beginPath();c.arc(d.x,d.y,d.r,0,7);c.fill()}c.globalAlpha=1;
 c.lineWidth=3;c.strokeStyle='#75cfe276';c.beginPath();c.moveTo(tank.x,tank.y);c.lineTo(tank.x,tank.y+tank.h);c.lineTo(tank.x+tank.w,tank.y+tank.h);c.lineTo(tank.x+tank.w,tank.y);c.stroke();
 c.fillStyle='#d9faff95';c.textAlign='center';c.font='12px system-ui';c.fillText(mode==='free'?'물 50%로 시작 · 기울이기 / 흔들기 / 터치':'배를 눌러 구멍을 내고 흔들어 침몰시키세요',W/2,Math.min(H-80,tank.y+tank.h+27));
}
function loop(){update();draw();requestAnimationFrame(loop)}
resize();updateLabel();if(!('DeviceOrientationEvent'in window)&&!('DeviceMotionEvent'in window))status('센서 미지원 · 터치로 플레이','off');requestAnimationFrame(loop);
})();
</script></body></html>
